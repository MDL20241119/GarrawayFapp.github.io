<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
<title id="title">GarrawayF 天神CLASS 3階 スペース紹介</title>
<desc id="desc">添付資料に沿ったGarrawayFのフロアマップ。リビングラボ80席以上、会議室1・2、受付、モノづくりラボ32席、スタジオ、集中スペース30席、ダイニング、キッチン、Serendipity Street、エントランス、エレベーター。</desc>
