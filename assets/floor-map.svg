<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc"><title id="title">Garraway F Floor Map</title><desc id="desc">Garraway F 天神CLASS 3階のフロアマップ</desc><style>.wall{stroke:#111;stroke-width:2;vector-effect:non-scaling-stroke}.label{font:700 22px 'Noto Sans JP',Arial,sans-serif;fill:#111}.sub{font:500 13px 'Noto Sans JP',Arial,sans-serif;fill:#333}.meta{font:700 11px Arial,'Noto Sans JP',sans-serif;letter-spacing:1.5px;fill:#086bdd}.furn{fill:none;stroke:#555;stroke-width:1.5;vector-effect:non-scaling-stroke}.small{font:600 15px 'Noto Sans JP',Arial,sans-serif;fill:#111}</style><rect width="1500" height="650" fill="#fff"/><text x="45" y="60" font-family="Arial Black,Arial,sans-serif" font-size="54" font-weight="900" fill="#111">FLOOR MAP</text><text x="48" y="88" class="meta">TENJIN CLASS 3F / GARRAWAY F</text><g transform="translate(245 38)"><rect class="wall" x="0" y="0" width="315" height="390" fill="#fff1bd"/><text class="meta" x="20" y="28">01 / LIVING</text><text class="label" x="20" y="330">リビングラボ</text><text class="sub" x="20" y="355">交流・対話・ワークショップ</text><g class="furn" transform="translate(55 82)"><rect x="0" y="0" width="34" height="180"/><rect x="64" y="0" width="34" height="180"/><rect x="128" y="0" width="34" height="180"/><rect x="192" y="0" width="34" height="180"/></g><rect class="wall" x="315" y="0" width="185" height="110" fill="#dcecff"/><text class="meta" x="333" y="27">02 / MEETING</text><text class="small" x="350" y="68">会議室 ①</text><rect class="furn" x="365" y="80" width="82" height="16"/><rect class="wall" x="315" y="110" width="185" height="110" fill="#e8f2dc"/><text class="meta" x="333" y="137">03 / MEETING</text><text class="small" x="350" y="178">会議室 ②</text><rect class="furn" x="365" y="190" width="82" height="16"/><rect class="wall" x="315" y="220" width="185" height="170" fill="#ffd7e5"/><text class="meta" x="333" y="248">04 / RECEPTION</text><text class="small" x="342" y="294">受付スペース</text><path class="furn" d="M350 350h112v-34H350z"/><rect class="wall" x="500" y="0" width="340" height="390" fill="#dcecff"/><text class="meta" x="520" y="28">05 / BUILD</text><text class="label" x="520" y="330">モノづくりラボ</text><text class="sub" x="520" y="355">試作・開発・共創</text><g class="furn" transform="translate(560 78)"><rect x="0" y="0" width="34" height="185"/><rect x="92" y="0" width="34" height="185"/><rect x="184" y="0" width="34" height="185"/></g><rect class="wall" x="840" y="0" width="320" height="390" fill="#ead9ef"/><text class="meta" x="860" y="28">06 / STUDIO + FOCUS</text><rect class="furn" x="865" y="52" width="205" height="130"/><text class="label" x="885" y="145">スタジオ</text><text class="sub" x="885" y="168">撮影・配信・イベント</text><g class="furn" transform="translate(865 235)"><rect x="0" y="0" width="112" height="46"/><rect x="145" y="0" width="34" height="30"/><rect x="205" y="0" width="34" height="30"/><rect x="145" y="55" width="34" height="30"/><rect x="205" y="55" width="34" height="30"/></g><text class="small" x="865" y="355">集中スペース</text><rect class="wall" x="0" y="390" width="200" height="145" fill="#e8f2dc"/><text class="meta" x="18" y="418">07 / DINING</text><text class="label" x="20" y="476">ダイニング</text><text class="sub" x="20" y="500">食事・休憩・交流</text><rect class="wall" x="200" y="390" width="115" height="145" fill="#ffe2bd"/><text class="meta" x="214" y="418">08</text><text class="small" x="214" y="476">キッチン</text><rect class="wall" x="315" y="390" width="845" height="95" fill="#f1eeea"/><text class="meta" x="335" y="418">SERENDIPITY STREET</text><text class="label" x="520" y="455">偶然の出会いが生まれる通り</text><line x1="335" y1="470" x2="1140" y2="470" stroke="#fff" stroke-width="5" stroke-dasharray="20 15"/><rect class="wall" x="405" y="485" width="265" height="78" fill="#fff3c8"/><text class="small" x="480" y="532">エレベーター</text><path d="M1160 155h90" stroke="#111" stroke-width="7"/><path d="M1230 132l35 23-35 23" fill="none" stroke="#111" stroke-width="7"/><text class="meta" x="1278" y="151">ENTRANCE</text><text class="small" x="1278" y="174">出入口</text></g><g transform="translate(45 560)"><rect x="0" y="0" width="10" height="10" fill="#fff1bd" stroke="#111"/><text x="18" y="10" class="sub">LIVING</text><rect x="105" y="0" width="10" height="10" fill="#dcecff" stroke="#111"/><text x="123" y="10" class="sub">MEETING / BUILD</text><rect x="285" y="0" width="10" height="10" fill="#ffd7e5" stroke="#111"/><text x="303" y="10" class="sub">RECEPTION</text><rect x="405" y="0" width="10" height="10" fill="#ead9ef" stroke="#111"/><text x="423" y="10" class="sub">STUDIO</text></g></svg>