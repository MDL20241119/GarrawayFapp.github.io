<title id="title">GarrawayF 天神CLASS 3階 スペース紹介</title>
<desc id="desc">添付資料に忠実に再構成したGarrawayFフロアマップ。リビングラボ80席以上、ダイニング、キッチン、会議室1・2、受付、モノづくりラボ32席、スタジオ、集中スペース30席、Serendipity Street、エントランス、エレベーターと各エリア写真。</desc>
