<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 610" role="img" aria-labelledby="t d"><title id="t">Garraway F Floor Map</title><desc id="d">Garraway Fのリビングラボ、会議室、受付、モノづくりラボ、スタジオ、集中スペース、ダイニング、キッチン、Serendipity streetを示したフロアマップ</desc><style>.r{stroke:#111;stroke-width:2}.t{font:700 24px Arial,'Noto Sans JP',sans-serif;fill:#111}.s{font:500 16px Arial,'Noto Sans JP',sans-serif;fill:#111}.desk{fill:none;stroke:#444;stroke-width:2}.chair{fill:#fff;stroke:#555;stroke-width:1.5}</style><rect width="1500" height="610" fill="#fff"/><text x="55" y="75" font-family="Arial Black,Arial" font-size="58" font-weight="900">FLOOR MAP</text><text x="58" y="108" class="t">フロアマップ</text><text x="58" y="165" class="s">人と人が自然に出会い、アイデアが生まれ、</text><text x="58" y="191" class="s">挑戦が育つ、まちのリビングラボ。</text><g transform="translate(265 35)"><rect class="r" x="0" y="0" width="300" height="380" fill="#fff1bd"/><text class="t" x="110" y="338">リビングラボ</text><text class="s" x="92" y="366">交流・対話・ワークショップ</text><g transform="translate(55 100)"><rect class="desk" x="0" y="0" width="28" height="160"/><rect class="desk" x="58" y="0" width="28" height="160"/><rect class="desk" x="116" y="0" width="28" height="160"/><rect class="desk" x="174" y="0" width="28" height="160"/></g><rect class="r" x="300" y="0" width="190" height="110" fill="#dff3fb"/><text class="t" x="350" y="62">会議室 ①</text><rect class="desk" x="365" y="18" width="60" height="30"/><rect class="r" x="300" y="110" width="190" height="110" fill="#e9f3dd"/><text class="t" x="350" y="173">会議室 ②</text><rect class="desk" x="365" y="130" width="60" height="30"/><rect class="r" x="300" y="220" width="190" height="160" fill="#ffd9e5"/><text class="t" x="350" y="267">受付スペース</text><path class="desk" d="M355 330h80v-35h-80z"/><circle class="desk" cx="395" cy="280" r="13"/><rect class="r" x="490" y="0" width="330" height="380" fill="#dff3fb"/><text class="t" x="588" y="310">モノづくりラボ</text><text class="s" x="594" y="338">試作・開発・共創の場</text><g transform="translate(550 80)"><rect class="desk" x="0" y="0" width="28" height="155"/><rect class="desk" x="85" y="0" width="28" height="155"/><rect class="desk" x="170" y="0" width="28" height="155"/></g><rect class="r" x="820" y="0" width="300" height="380" fill="#ead9ef"/><rect class="desk" x="842" y="20" width="210" height="150"/><text class="t" x="905" y="145">スタジオ</text><text class="s" x="884" y="171">撮影・配信・イベント</text><g transform="translate(850 230)"><rect class="desk" x="0" y="0" width="120" height="48"/><circle class="chair" cx="22" cy="-18" r="10"/><circle class="chair" cx="60" cy="-18" r="10"/><circle class="chair" cx="98" cy="-18" r="10"/><g transform="translate(150 0)"><rect class="chair" x="0" y="0" width="32" height="28"/><rect class="chair" x="58" y="0" width="32" height="28"/><rect class="chair" x="116" y="0" width="32" height="28"/><rect class="chair" x="0" y="52" width="32" height="28"/><rect class="chair" x="58" y="52" width="32" height="28"/><rect class="chair" x="116" y="52" width="32" height="28"/></g></g><text class="t" x="900" y="350">集中スペース</text><rect class="r" x="0" y="380" width="190" height="140" fill="#e5f0d5"/><text class="t" x="35" y="445">ダイニング</text><text class="s" x="42" y="473">食事・休憩・交流</text><rect class="r" x="190" y="380" width="110" height="140" fill="#ffe0bd"/><text class="t" x="203" y="445">キッチン</text><text class="s" x="210" y="473">調理・交流</text><rect class="r" x="300" y="380" width="820" height="95" fill="#f0ece7"/><line x1="320" y1="428" x2="1100" y2="428" stroke="#fff" stroke-width="6" stroke-dasharray="24 18"/><text class="t" x="560" y="415">Serendipity street</text><text class="s" x="555" y="451">偶然の出会いが生まれる通り</text><rect class="r" x="390" y="475" width="270" height="90" fill="#fff3c8"/><text class="t" x="470" y="530">エレベーター</text><path d="M1120 150h110" stroke="#111" stroke-width="8"/><path d="M1210 125l40 25-40 25" fill="none" stroke="#111" stroke-width="8"/><text class="t" x="1260" y="160">出入口</text></g></svg>