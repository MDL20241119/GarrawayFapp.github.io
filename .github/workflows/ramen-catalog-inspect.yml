name: Inspect public RAMEN TECH catalog
on:
  push:
    paths:
      - '.github/workflows/ramen-catalog-inspect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect public event schedule data
        run: |
          mkdir -p public-source-snapshot
          python3 - <<'PY'
          import urllib.request, json, pathlib
          root=pathlib.Path('public-source-snapshot')
          sources={'schedule':'https://ramentech2026.aishain.com/api/schedule','members':'https://members.ramentech.jp/','summit':'https://ramentech-summit.com/','startup-kyushu':'https://startupkyushu.com/','ffg':'https://ffg-mirainokaigi.jp/','gogo':'https://startup-gogo.com/event/'}
          for name,url in sources.items():
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (public event schedule verification)'})
                  with urllib.request.urlopen(req,timeout=30) as res:
                      body=res.read().decode('utf-8','replace')
                      print(name,res.status,'bytes',len(body))
                  if name=='schedule':
                      data=json.loads(body)
                      print('PUBLIC SCHEDULE KEYS',list(data.keys()))
                      print('COUNTS',{k:len(v) for k,v in data.items() if isinstance(v,(list,dict))})
                      print('FIRST SESSION',json.dumps(data.get('sessions',[])[:1],ensure_ascii=False))
                  (root/(name+('.json' if name=='schedule' else '.html'))).write_text(body)
              except Exception as exc:print('SOURCE UNAVAILABLE',name,str(exc))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ramen-public-schedule-data
          path: public-source-snapshot
          retention-days: 3
