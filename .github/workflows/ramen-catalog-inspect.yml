name: Inspect public RAMEN TECH catalog
on:
  push:
    paths:
      - '.github/workflows/ramen-catalog-inspect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect public event page assets
        run: |
          mkdir -p public-source-snapshot
          python3 - <<'PY'
          import urllib.request, urllib.parse, re, json, pathlib, concurrent.futures
          root=pathlib.Path('public-source-snapshot')
          sources={'official':'https://www.ramentech.jp/','timetable':'https://ramentech2026.aishain.com/','members':'https://members.ramentech.jp/'}
          manifest=[]
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (public event schedule verification)'})
              with urllib.request.urlopen(req,timeout=30) as res:
                  return res.read().decode('utf-8','replace'),dict(res.headers)
          for name,url in sources.items():
              try:
                  body,headers=get(url)
                  (root/(name+'.html')).write_text(body)
                  print(name,'HTML bytes',len(body),'embed headers',{k:v for k,v in headers.items() if k.lower() in ['x-frame-options','content-security-policy','access-control-allow-origin']})
                  scripts=re.findall(r'<script[^>]+src=[\"\x27]([^\"\x27]+)',body)
                  print(name,'SCRIPTS',json.dumps(scripts))
                  manifest.append({'name':name,'url':url,'scripts':scripts})
                  for i,src in enumerate(scripts[:24]):
                      src=urllib.parse.urljoin(url,src.replace('&amp;','&'))
                      if urllib.parse.urlparse(src).hostname not in ['www.ramentech.jp','ramentech2026.aishain.com','members.ramentech.jp','cdn.entrytickets.be']:continue
                      try:
                          text,_=get(src)
                          (root/(name+'-'+str(i)+'.js')).write_text(text)
                          hits=re.findall(r'.{0,140}(?:/api/|events\.json|supabase|fetch\(|axios|calendar-events|eventData|eventsData).{0,250}',text)
                          print(name,i,'bytes',len(text),'ENDPOINT HINTS',json.dumps(hits[:50],ensure_ascii=False))
                      except Exception as exc: print('asset unavailable',src,str(exc))
              except Exception as exc:print('page unavailable',url,str(exc))
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ramen-public-source-snapshot
          path: public-source-snapshot
          retention-days: 3
