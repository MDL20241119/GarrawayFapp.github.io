name: Inspect public RAMEN TECH catalog
on:
  push:
    paths: ['.github/workflows/ramen-catalog-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Collect public feeds and current guide
        run: |
          mkdir -p public-source-snapshot
          cp -r ramen-tech-2026 public-source-snapshot/site
          cp -r .github/workflows public-source-snapshot/workflows
          python3 - <<'PY'
          import urllib.request, json, pathlib
          root=pathlib.Path('public-source-snapshot')
          sources={'schedule':'https://ramentech2026.aishain.com/api/schedule','members':'https://members.ramentech.jp/','official':'https://www.ramentech.jp/'}
          for name,url in sources.items():
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (RAMEN event guide; public schedule verification)'})
                  with urllib.request.urlopen(req,timeout=40) as res:
                      body=res.read().decode('utf-8','replace')
                      print(name,res.status,'bytes',len(body))
                  (root/(name+('.json' if name=='schedule' else '.html'))).write_text(body)
              except Exception as exc:print('SOURCE UNAVAILABLE',name,str(exc))
          PY
      - name: Inspect publishing configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/pages" > public-source-snapshot/pages.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: ramen-sync-inputs
          path: public-source-snapshot
          retention-days: 3
