name: Update Instagram Feed

on:
  workflow_dispatch:
  schedule:
    # Multiple off-peak opportunities reduce long delays in GitHub's
    # best-effort scheduled runner without changing the site runtime cost.
    - cron: '7,37 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/instagram-feed.yml'
      - 'scripts/update_instagram.py'
      - 'scripts/test_instagram_feed.py'

permissions:
  contents: write

concurrency:
  group: instagram-feed-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check --no-deps Pillow==12.3.0
      - name: Test Instagram sync and failure preservation
        run: python -m unittest discover -s scripts -p 'test_instagram*.py' -v
      - name: Validate existing website snapshot
        run: python scripts/validate_site.py
      - name: Fetch latest Instagram posts and mirror images
        id: fetch
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python scripts/update_instagram.py
      - name: Validate persistent website features
        id: validation
        if: ${{ !cancelled() && (steps.fetch.outcome == 'success' || steps.fetch.outcome == 'failure') }}
        run: python scripts/validate_site.py
      - name: Commit validated feed or failure status
        # A failed fetch remains a failed job. Only its sanitized status changes;
        # existing feed/images are preserved and validated before any commit.
        if: ${{ !cancelled() && steps.validation.outcome == 'success' && (steps.fetch.outcome == 'success' || steps.fetch.outcome == 'failure') }}
        run: |
          git config user.name 'garrawayf-feed-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add --all data/instagram.json data/instagram-sync-status.json images/instagram
          if ! git diff --cached --quiet; then
            git commit -m 'Update Instagram feed sync snapshot and status'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
