name: Update Instagram Feed

on:
  workflow_dispatch:
  schedule:
    # Multiple off-peak opportunities reduce long delays in GitHub's
    # best-effort scheduled runner without changing the site runtime cost.
    - cron: '7,37 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/instagram-feed.yml'

permissions:
  contents: write

concurrency:
  group: instagram-feed-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch latest Instagram posts and mirror images
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          token = os.environ.get('INSTAGRAM_ACCESS_TOKEN', '')
          uid = os.environ.get('INSTAGRAM_USER_ID', '')
          if not token or not uid:
              raise SystemExit('Set INSTAGRAM_ACCESS_TOKEN and INSTAGRAM_USER_ID in GitHub Actions secrets.')

          fields = 'id,caption,media_type,media_url,thumbnail_url,permalink,timestamp'

          def fetch_edge(edge: str, edge_fields: str = fields) -> list[dict]:
              query = urllib.parse.urlencode({
                  'fields': edge_fields,
                  'limit': '25',
                  'access_token': token,
              })
              url = f'https://graph.instagram.com/{uid}/{edge}?{query}'
              request = urllib.request.Request(
                  url,
                  headers={'User-Agent': 'GarrawayF-feed/2.0'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              return payload.get('data', [])

          # /media contains posts published by Garraway F. Accepted
          # collaborative posts have their own edge, so merge that feed too.
          # Keep it optional because older tokens may not expose the endpoint.
          candidates = fetch_edge('media')
          collaborative_posts_available = False
          try:
              candidates.extend(fetch_edge('collaborative_media'))
              collaborative_posts_available = True
          except Exception as error:
              print(f'Collaborative posts unavailable: {error}')

          # Some existing Instagram Login tokens do not yet expose the newer
          # collaborative edge. Tagged media is a useful compatibility
          # fallback and still represents activity connected to this account.
          tagged_posts_available = False
          if not collaborative_posts_available:
              try:
                  candidates.extend(fetch_edge('tags'))
                  tagged_posts_available = True
              except Exception as error:
                  print(f'Tagged-post fallback unavailable: {error}')

          # Stories are often the account's newest activity even when no new
          # feed post exists. Include currently active stories in the same
          # newest-first stream and mark them so the UI can label them.
          stories_available = False
          try:
              story_fields = 'id,media_type,media_url,thumbnail_url,permalink,timestamp'
              stories = fetch_edge('stories', story_fields)
              for story in stories:
                  story['_is_story'] = True
              candidates.extend(stories)
              stories_available = True
          except Exception as error:
              print(f'Instagram stories unavailable: {error}')

          unique_posts: dict[str, dict] = {}
          for post in candidates:
              identity = str(post.get('id') or post.get('permalink') or '')
              if identity:
                  unique_posts[identity] = post

          latest_posts = sorted(
              unique_posts.values(),
              key=lambda post: post.get('timestamp', ''),
              reverse=True,
          )[:6]

          image_root = Path('images/instagram')
          image_root.mkdir(parents=True, exist_ok=True)
          kept_images: set[str] = set()
          posts = []

          for post in latest_posts:
              post_id = re.sub(r'[^0-9A-Za-z_-]', '', str(post.get('id', ''))) or 'post'
              source_image = post.get('thumbnail_url') or post.get('media_url') or ''
              mirrored_image = ''

              if source_image:
                  try:
                      image_request = urllib.request.Request(
                          source_image,
                          headers={'User-Agent': 'Mozilla/5.0'},
                      )
                      with urllib.request.urlopen(image_request, timeout=45) as response:
                          content = response.read(20_000_001)
                          content_type = response.headers.get_content_type()
                      if len(content) > 20_000_000:
                          raise ValueError('Instagram image exceeded 20 MB')
                      extensions = {
                          'image/jpeg': 'jpg',
                          'image/png': 'png',
                          'image/webp': 'webp',
                          'image/gif': 'gif',
                      }
                      extension = extensions.get(content_type, 'jpg')
                      image_path = image_root / f'{post_id}.{extension}'
                      image_path.write_bytes(content)
                      mirrored_image = image_path.as_posix()
                      kept_images.add(image_path.name)
                  except Exception as error:
                      existing = sorted(image_root.glob(f'{post_id}.*'))
                      if existing:
                          mirrored_image = existing[0].as_posix()
                          kept_images.add(existing[0].name)
                      else:
                          print(f'Image mirror fallback for {post_id}: {error}')
                          mirrored_image = source_image

              posts.append({
                  'id': post.get('id'),
                  'caption': post.get('caption', ''),
                  'media_type': post.get('media_type', ''),
                  'is_story': bool(post.get('_is_story', False)),
                  'image': mirrored_image,
                  'permalink': post.get('permalink', ''),
                  'timestamp': post.get('timestamp', ''),
              })

          for image_path in image_root.iterdir():
              if image_path.is_file() and image_path.name not in kept_images:
                  image_path.unlink()

          Path('data').mkdir(exist_ok=True)
          feed_path = Path('data/instagram.json')
          previous_feed = {}
          if feed_path.exists():
              try:
                  previous_feed = json.loads(feed_path.read_text(encoding='utf-8'))
              except Exception as error:
                  print(f'Previous feed metadata unavailable: {error}')

          previous_posts = previous_feed.get('posts', []) if isinstance(previous_feed, dict) else []
          previous_identity = [
              (post.get('id'), post.get('timestamp'))
              for post in previous_posts
              if isinstance(post, dict)
          ]
          current_identity = [(post.get('id'), post.get('timestamp')) for post in posts]
          now = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          updated_at = (
              now
              if current_identity != previous_identity
              else previous_feed.get('updated_at', now)
          )

          with feed_path.open('w', encoding='utf-8') as output:
              json.dump(
                  {
                      'account': 'garrawayf_lounge',
                      'sort': 'newest_first',
                      'includes_collaborative_posts': collaborative_posts_available,
                      'includes_tagged_posts': tagged_posts_available,
                      'includes_stories': stories_available,
                      'updated_at': updated_at,
                      'posts': posts,
                  },
                  output,
                  ensure_ascii=False,
                  indent=2,
              )
              output.write('\n')

          latest = posts[0] if posts else {}
          print(f'Feed checked at {now}')
          print(
              'Latest selected post: '
              f"{latest.get('id', 'none')} / {latest.get('timestamp', 'unknown')}"
          )
          PY
      - name: Validate persistent website features
        run: python scripts/validate_site.py
      - name: Commit feed
        run: |
          git config user.name 'garrawayf-feed-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add --all data/instagram.json images/instagram
          git diff --cached --quiet || git commit -m 'Update Instagram feed and local images'
          git push
