name: Update Instagram Feed
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch latest Instagram posts
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          token=os.environ.get('INSTAGRAM_ACCESS_TOKEN','')
          uid=os.environ.get('INSTAGRAM_USER_ID','')
          if not token or not uid:
              raise SystemExit('Set INSTAGRAM_ACCESS_TOKEN and INSTAGRAM_USER_ID in GitHub Actions secrets.')
          fields='id,caption,media_type,media_url,thumbnail_url,permalink,timestamp'
          q=urllib.parse.urlencode({'fields':fields,'limit':'6','access_token':token})
          url=f'https://graph.instagram.com/{uid}/media?{q}'
          with urllib.request.urlopen(url, timeout=30) as r:
              data=json.load(r)
          posts=[]
          for p in data.get('data',[])[:6]:
              posts.append({
                'id':p.get('id'), 'caption':p.get('caption',''),
                'media_type':p.get('media_type',''),
                'image':p.get('thumbnail_url') or p.get('media_url',''),
                'permalink':p.get('permalink',''), 'timestamp':p.get('timestamp','')
              })
          os.makedirs('data',exist_ok=True)
          with open('data/instagram.json','w',encoding='utf-8') as f:
              json.dump({'account':'garrawayf_lounge','posts':posts},f,ensure_ascii=False,indent=2)
          PY
      - name: Validate persistent website features
        run: python scripts/validate_site.py
      - name: Commit feed
        run: |
          git config user.name 'garrawayf-feed-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/instagram.json
          git diff --cached --quiet || git commit -m 'Update Instagram feed'
          git push
